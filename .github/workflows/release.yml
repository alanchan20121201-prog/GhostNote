name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: 编译并发布四种语言的单文件 exe
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 还原依赖
        run: dotnet restore src/GhostNote/GhostNote.csproj

      # 每种语言单独 publish：编译期常量决定文案与字体，产出互不干扰的独立 exe
      - name: 编译四种语言（zh-cn / zh-tw / en / ja）
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $langs = @("zh-cn", "zh-tw", "en", "ja")
          foreach ($lang in $langs) {
            Write-Host "==> 发布 $lang"
            dotnet publish src/GhostNote/GhostNote.csproj `
              -c Release `
              -r win-x64 `
              --self-contained false `
              -p:PublishSingleFile=true `
              -p:DebugType=none `
              -p:GhostNoteLang=$lang `
              -o "publish/$lang"
            if ($LASTEXITCODE -ne 0) { throw "$lang 编译失败" }
            Copy-Item "publish/$lang/GhostNote-$lang.exe" "GhostNote-$lang-$tag-win-x64.exe"
          }

      - name: 语言隔离校验（每个 exe 只能含自己的文案）
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $probes = @{
            "zh-cn" = "隐藏水印"
            "zh-tw" = "隱藏浮水印"
            "en"    = "Hide watermark"
            "ja"    = "透かしを隠す"
          }
          function Test-ContainsUtf16([string]$path, [string]$text) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $needle = [System.Text.Encoding]::Unicode.GetBytes($text)
            $limit = $bytes.Length - $needle.Length
            for ($i = 0; $i -le $limit; $i++) {
              if ($bytes[$i] -ne $needle[0]) { continue }
              $hit = $true
              for ($j = 1; $j -lt $needle.Length; $j++) {
                if ($bytes[$i + $j] -ne $needle[$j]) { $hit = $false; break }
              }
              if ($hit) { return $true }
            }
            return $false
          }
          foreach ($lang in $probes.Keys) {
            $file = "GhostNote-$lang-$tag-win-x64.exe"
            if (-not (Test-ContainsUtf16 $file $probes[$lang])) {
              throw "$lang 的 exe 里找不到本语言文案"
            }
            foreach ($other in $probes.Keys) {
              if ($other -ne $lang -and (Test-ContainsUtf16 $file $probes[$other])) {
                throw "$lang 的 exe 混入了 $other 文案"
              }
            }
            Write-Host "$lang 文案校验通过"
          }

      - name: 体积门禁（每个 exe 都必须小于 5MB）
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          foreach ($lang in @("zh-cn", "zh-tw", "en", "ja")) {
            $file = Get-Item "GhostNote-$lang-$tag-win-x64.exe"
            $mb = [math]::Round($file.Length / 1MB, 2)
            Write-Host "$lang : $mb MB"
            if ($file.Length -gt 5MB) {
              throw "发布失败：$lang 产物 $mb MB，超过 5MB 上限"
            }
          }

      - name: 组装 Release 说明（四语模板 + 四个附件信息）
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $body = (Get-Content "docs/RELEASE_NOTES_TEMPLATE.md" -Raw -Encoding utf8).TrimEnd()

          $lines = @(
            ''
            '---'
            ''
            '## 下载 / ダウンロード / Downloads'
            ''
            '| 语言 | 文件 | 大小 | SHA256 |'
            '| --- | --- | --- | --- |'
          )
          $langNames = @{
            "zh-cn" = "简体中文"
            "zh-tw" = "繁體中文"
            "en"    = "English"
            "ja"    = "日本語"
          }
          foreach ($lang in @("zh-cn", "zh-tw", "en", "ja")) {
            $name = "GhostNote-$lang-$tag-win-x64.exe"
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
            $size = [math]::Round((Get-Item $name).Length / 1KB, 0)
            $lines += "| $($langNames[$lang]) | ``$name`` | $size KB | ``$hash`` |"
          }
          $lines += @('', '四个 exe 功能完全相同，只是界面语言与字体不同，任选其一即可。', '')
          $footer = $lines -join "`n"

          $body + "`n" + $footer | Out-File -FilePath release_body.md -Encoding utf8

      - name: 上传构建产物（保留 14 天，便于排查）
        uses: actions/upload-artifact@v4
        with:
          name: GhostNote-${{ github.ref_name }}-win-x64-all
          path: |
            GhostNote-zh-cn-${{ github.ref_name }}-win-x64.exe
            GhostNote-zh-tw-${{ github.ref_name }}-win-x64.exe
            GhostNote-en-${{ github.ref_name }}-win-x64.exe
            GhostNote-ja-${{ github.ref_name }}-win-x64.exe
          retention-days: 14

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GhostNote ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            GhostNote-zh-cn-${{ github.ref_name }}-win-x64.exe
            GhostNote-zh-tw-${{ github.ref_name }}-win-x64.exe
            GhostNote-en-${{ github.ref_name }}-win-x64.exe
            GhostNote-ja-${{ github.ref_name }}-win-x64.exe
          draft: false
          prerelease: false
